services:
  db:
    # Multi-arch PostGIS build: the official postgis/postgis image publishes amd64 only, which
    # breaks every Apple Silicon machine. Override with POSTGIS_IMAGE if you prefer another.
    image: ${POSTGIS_IMAGE:-imresamu/postgis:17-3.5}
    container_name: artesanal-db
    environment:
      POSTGRES_USER: artesanal
      POSTGRES_PASSWORD: artesanal
      POSTGRES_DB: artesanal
    ports:
      # 5432 is often taken by another local Postgres; override with POSTGRES_PORT if 5434 clashes.
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artesanal -d artesanal']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    # minio/minio is gone from Docker Hub and quay.io needs a login; Chainguard rebuilds MinIO from
    # source. The -dev variant is the one that ships the mc used by the healthcheck.
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: artesanal-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: artesanal
      MINIO_ROOT_PASSWORD: artesanal123
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storage-objects:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot container: creates the bucket and makes product photos publicly readable,
  # so the app never has to bootstrap its own storage on boot.
  storage-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 artesanal artesanal123 &&
      mc mb --ignore-existing local/artesanal &&
      mc anonymous set download local/artesanal
      "

volumes:
  db-data:
  # Not "storage-data": that volume was written as root by the old image, and the Chainguard one
  # runs as UID 65532 and cannot write to it. A new name gives every machine a fresh volume.
  storage-objects:
