name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Official postgis/postgis publishes amd64 only; this multi-arch build works on every runner.
  POSTGIS_IMAGE: imresamu/postgis:17-3.5

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint (includes accessibility and architecture boundaries)
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration tests (PostGIS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Testcontainers starts its own PostGIS container against the runner's Docker daemon, so no
      # service container is declared here.
      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest

    # The home page is the proximity search, so the E2E run needs a real PostGIS with the schema
    # applied and the demo artisans seeded — the app must boot with a valid configuration during
    # the build, and the assertions read the seeded fair.
    env:
      DATABASE_URL: postgres://artesanal:artesanal@localhost:5432/artesanal
      BETTER_AUTH_SECRET: ci-secret-with-at-least-32-characters!!
      BETTER_AUTH_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: artesanal
      S3_ACCESS_KEY_ID: artesanal
      S3_SECRET_ACCESS_KEY: artesanal123
      S3_PUBLIC_URL: http://localhost:9000/artesanal
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    services:
      db:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: artesanal
          POSTGRES_PASSWORD: artesanal
          POSTGRES_DB: artesanal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artesanal -d artesanal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Database schema and demo data
        run: pnpm db:migrate && pnpm db:seed

      # Not a service container: MinIO needs its own command ("server /data"), which the services
      # block cannot set. The bucket has to exist and be publicly readable before the app boots,
      # the same bootstrap docker-compose does with the "storage-init" container.
      - name: Object storage
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e MINIO_ROOT_USER=artesanal -e MINIO_ROOT_PASSWORD=artesanal123 \
            minio/minio:latest server /data
          until curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; do sleep 1; done
          docker run --rm --network host minio/mc:latest sh -c "
            mc alias set local http://127.0.0.1:9000 artesanal artesanal123 &&
            mc mb --ignore-existing local/artesanal &&
            mc anonymous set download local/artesanal
          "

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
